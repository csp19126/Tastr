name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tastr_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tastr_test
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run check
      - name: Tests (against a real Postgres)
        run: npm test
      - name: Production build
        run: npm run build
      - name: Smoke test the built server
        run: |
          NODE_ENV=production DATABASE_URL=$TEST_DATABASE_URL PORT=4050 UPLOAD_DIR=/tmp/up node dist/index.js &
          for i in $(seq 1 30); do curl -sf localhost:4050/health && break; sleep 1; done
          curl -sf localhost:4050/health
          curl -sf "localhost:4050/api/content?lang=vi" > /dev/null

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Expo doctor
        run: npx expo-doctor
      - name: Bundle for Android, iOS and web
        run: |
          npx expo export --platform android --output-dir /tmp/out-android
          npx expo export --platform ios --output-dir /tmp/out-ios
          npx expo export --platform web --output-dir /tmp/out-web
